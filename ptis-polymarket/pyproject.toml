[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ptis"
version = "0.1.0"
description = "Research-only Polymarket trader intelligence and shadow-copy system"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ptis = "ptis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
